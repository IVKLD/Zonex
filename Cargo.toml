[package]
name = "zonex"
version = "0.1.0"
edition = "2021"
authors = ["Zonex Team"]
description = "Wayland-native Archive Manager with Zero-Latency FUSE Drag-and-Drop"

[dependencies]
gtk4 = { version = "0.11.4", features = ["v4_12"] }
libadwaita = { version = "0.9.2", features = ["v1_4"] }
gdk4 = { version = "0.11.4", features = ["v4_12"] }
glib = "0.22.8"
gio = "0.22.8"
zip = "8.6.0"
tar = "0.4.44"
flate2 = "1.1.2"
zstd = "0.13.3"
tempfile = "3.19.1"
anyhow = "1.0.98"
thiserror = "2.0.19"
url = "2.5.4"
walkdir = "2.5.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
compress-tools = "0.16.1"
fuser = "0.18.0"
libc = "0.2"
crc32fast = "1.4"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
needless_borrow = "deny"
explicit_iter_loop = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
