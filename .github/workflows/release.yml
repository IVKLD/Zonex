name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libarchive-dev libfuse3-dev pkg-config

      - name: Build release binary
        run: cargo build --release

      - name: Package release asset
        run: |
          mkdir -p dist
          tar -czvf dist/zonex-x86_64-linux.tar.gz -C target/release zonex

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zonex-x86_64-linux.tar.gz
            target/release/zonex
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
