<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e"/>
      <stop offset="50%" stop-color="#161224"/>
      <stop offset="100%" stop-color="#0d0a17"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Inner Shadow Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="8" y="8" width="112" height="112" rx="28" ry="28" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2"/>

  <!-- Zipper Track Background -->
  <rect x="61" y="24" width="6" height="80" rx="3" fill="#2d264a"/>

  <!-- Zipper Teeth (Alternating Left/Right) -->
  <rect x="55" y="30" width="8" height="4" rx="1" fill="#7c3aed"/>
  <rect x="65" y="38" width="8" height="4" rx="1" fill="#7c3aed"/>
  <rect x="55" y="46" width="8" height="4" rx="1" fill="#7c3aed"/>
  <rect x="65" y="54" width="8" height="4" rx="1" fill="#7c3aed"/>
  <rect x="55" y="62" width="8" height="4" rx="1" fill="#7c3aed"/>
  <rect x="65" y="70" width="8" height="4" rx="1" fill="#7c3aed"/>
  <rect x="55" y="78" width="8" height="4" rx="1" fill="#7c3aed"/>
  <rect x="65" y="86" width="8" height="4" rx="1" fill="#7c3aed"/>

  <!-- Modern Zipper Pull Slider with Wayland Lightning Bolt -->
  <g filter="url(#glow)">
    <!-- Slider Base -->
    <rect x="50" y="48" width="28" height="32" rx="6" fill="url(#accent-grad)"/>
    <!-- Pull Ring -->
    <path d="M58 80 L70 80 L68 94 L60 94 Z" fill="url(#accent-grad)"/>
    <circle cx="64" cy="90" r="2" fill="#0d0a17"/>
    <!-- Lightning Bolt Icon on Puller -->
    <path d="M66 54 L58 65 L64 65 L62 74 L70 63 L64 63 Z" fill="#ffffff"/>
  </g>
</svg>
